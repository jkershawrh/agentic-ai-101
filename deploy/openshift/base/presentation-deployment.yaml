apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ai-101-presentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-ai-101
      app.kubernetes.io/component: presentation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-ai-101
        app.kubernetes.io/component: presentation
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: nginx-temporary-files
          emptyDir: {}
      containers:
        - name: presentation
          image: ghcr.io/jkershawrh/agentic-ai-101-presentation@sha256:e397d3e94e40fe2d91d0aca333156563d6d300d3b8fc4e5251c08ea1d7a104ea
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - name: nginx-temporary-files
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
