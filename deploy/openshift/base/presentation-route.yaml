apiVersion: route.openshift.io/v1
kind: Route
metadata:
  # OpenShift prefixes the generated host with the Route name. Keep this short
  # enough for Launchpad's per-seat namespace to remain a valid DNS label.
  name: story
spec:
  to:
    kind: Service
    name: agentic-ai-101-presentation
  port: {targetPort: http}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
