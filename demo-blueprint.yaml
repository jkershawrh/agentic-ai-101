status: reviewed
source:
  name: agentic-ai-101
  kind: product-owner-approved-rough-idea
  location: local-design
  revision: design-2026-10-02-v1
  discovered_at: "2026-10-02"
  inspected_artifacts:
    - /Users/jkershaw/Documents/launchpad/contracts/catalog-learning-progression-v1.yaml
    - /Users/jkershaw/Documents/launchpad/docs/catalog-learning-progression.md
