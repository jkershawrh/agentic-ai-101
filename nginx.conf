server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /fonts/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /logos/ { try_files $uri =404; add_header Cache-Control "public, max-age=86400"; }
  location = /healthz { default_type application/json; return 200 '{"status":"ok"}'; }
  location /api/ {
    proxy_pass http://agentic-ai-101:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
